; ThingPulse ePulse Feather (ESP32-WROVER-E) + 3.5" 320x480 ILI9488 TFT + FT6236 capacitive touch
; Pin assignments follow ThingPulse's Color Kit Grande sample project:
; https://github.com/ThingPulse/esp32-weather-station-touch

[env:epulse-feather]
platform = espressif32@~6.9.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
; Lower to 460800 if uploads fail.
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; --- TFT_eSPI setup (replaces the library's User_Setup.h) ---
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=18
  -D TFT_SCLK=5
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D TFT_BL=32
  -D TFT_BACKLIGHT_ON=HIGH
  ; Not a real resistive-touch pin; defined as in the ThingPulse sample to keep TFT_eSPI quiet.
  -D TOUCH_CS=21
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
  ; --- FT6236 capacitive touch (I2C) ---
  -D TOUCH_SDA=23
  -D TOUCH_SCL=22
lib_deps =
  bodmer/TFT_eSPI@~2.5.43
  bblanchon/ArduinoJson@^7.2.0
