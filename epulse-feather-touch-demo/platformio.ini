; GitHub activity display for the ThingPulse ePulse Feather (ESP32-WROVER-E)
; with the 3.5" 320x480 ILI9488 TFT and FT6236 capacitive touch.
;
;   pio run -t upload               build and flash the device
;   pio run -e simulator -t exec    build and run in a window on this computer
;
; Display and touch pins are set in include/display.h.

[platformio]
default_envs = epulse-feather

[env]
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.2.0

[env:epulse-feather]
platform = espressif32@~6.9.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
; Lower to 460800 if uploads fail.
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
build_src_filter = +<*> -<native/>

; Runs the same app code in an SDL2 window. Needs a C++ compiler, SDL2
; development files and the curl command (Fedora: dnf install gcc-c++ SDL2-devel).
[env:simulator]
platform = native
build_flags =
  -std=c++17
  -DSIMULATOR
  !sdl2-config --cflags --libs
build_src_filter = +<*> -<esp32/>
